[package]
name = "quests-tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
axum-extra = { version = "0.12.1", features = ["cookie", "typed-header"] }
cookie = "0.18.1"
async-trait = "0.1.89"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.6", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
chrono = { version = "0.4.42", features = ["serde"] }
mockall = "0.13.1"
diesel = { version = "2.3.3", features = [
    "postgres",
    "serde_json",
    "chrono",
    "r2d2",
] }
dotenvy = "0.15.7"
anyhow = "1.0.100"
argon2 = "0.5.3"
rand = "0.9.2"
jsonwebtoken = { version = "10.2.0", default-features = false, features = ["rust_crypto"] }

